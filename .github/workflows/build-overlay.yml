name: Build Android overlay
on:
  push:
    paths:
      - 'android-overlay/**'
      - '.github/workflows/build-overlay.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon --project-dir android-overlay assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brawl-room-menu-apk
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
