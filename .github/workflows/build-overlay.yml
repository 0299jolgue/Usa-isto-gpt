name: Build Android overlay
on:
  push:
    paths:
      - 'android-overlay/**'
      - '.github/workflows/build-overlay.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon --project-dir android-overlay assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: brawl-room-menu-apk
          path: android-overlay/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-overlay/app/build/outputs/apk/debug/app-debug.apk brawl-room-menu.apk
          if gh release view overlay-v6 >/dev/null 2>&1; then
            gh release upload overlay-v6 brawl-room-menu.apk --clobber
          else
            gh release create overlay-v6 brawl-room-menu.apk --title "Brawl Room Menu 1.5" --notes "Login do menu sem redirecionamento, recarga automática em erros 5xx e atualização sem cache."
          fi
