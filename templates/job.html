<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101424"><title>{{ title }} · Brawl Room</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body><main class="shell shell-job"><header class="topbar"><a class="brand" href="{{ url_for('bridge.home') }}"><span class="brand-mark" aria-hidden="true">✳</span> BRAWL ROOM</a><a class="back-link" href="{{ url_for('bridge.home') }}">← Voltar</a></header><section class="result-card"><p class="eyebrow">ESTADO DA AÇÃO</p><h1>{{ title }}</h1><div id="results" aria-live="polite">{% for device in result.devices %}<div class="status-panel device-result" data-state="{{ device.status }}"><span class="status-icon" aria-hidden="true"></span><div><strong>{{ device.name }}</strong><p class="status-label">{{ device.label }}</p><p class="status-detail" {% if not device.detail %}hidden{% endif %}>{{ device.detail }}</p></div></div>{% endfor %}</div><p class="waiting-note" id="waiting-note" {% if result.status not in ['queued','running'] %}hidden{% endif %}>Esta página atualiza automaticamente.</p><a class="button button-secondary result-back" href="{{ url_for('bridge.home') }}">Voltar ao painel <span aria-hidden="true">→</span></a></section></main><script>const endpoint={{ url_for('bridge.status',group_id=group_id)|tojson }};const cards=[...document.querySelectorAll('.device-result')];const note=document.getElementById('waiting-note');let timer;async function refresh(){try{const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)return;const data=await r.json();data.devices.forEach((d,i)=>{const card=cards[i];if(!card)return;card.dataset.state=d.status;card.querySelector('.status-label').textContent=d.label;const p=card.querySelector('.status-detail');p.textContent=d.detail||'';p.hidden=!d.detail});const pending=data.status==='queued'||data.status==='running';note.hidden=!pending;if(!pending)clearInterval(timer)}catch(_){}}refresh();timer=setInterval(refresh,2000);</script></body></html>
