<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101424"><title>Print de {{ device.name }} · Brawl Room</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head><body><main class="shell"><header class="topbar"><a class="brand" href="{{ url_for('bridge.home') }}"><span class="brand-mark" aria-hidden="true">✳</span> BRAWL ROOM</a><a class="back-link" href="{{ url_for('bridge.home') }}">← Voltar</a></header><section class="result-card screen-page"><p class="eyebrow">CAPTURA DO JOGO</p><h1>{{ device.name }}</h1>{% if device.screenshot_at %}<img id="game-screen" src="{{ url_for('bridge.screen',device_id=device.id) }}?t={{ device.screenshot_at|int }}" alt="Captura do jogo em {{ device.name }}" style="cursor:crosshair">{% else %}<p>Ainda não há print deste telemóvel.</p>{% endif %}<form method="post" action="{{ url_for('bridge.snapshot') }}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="target" value="{{ device.id }}"><button class="button button-secondary" type="submit">Tirar novo print <span aria-hidden="true">→</span></button></form><p>Toca no print para controlar o jogo. Para trocar de brawler, toca na personagem, aguarda o novo print e toca no brawler que queres.</p><form id="tap-form" method="post" action="{{ url_for('bridge.tap') }}"><input type="hidden" name="csrf" value="{{ csrf_token }}"><input type="hidden" name="target" value="{{ device.id }}"><input type="hidden" name="x" id="tap-x"><input type="hidden" name="y" id="tap-y"></form></section></main><script>const screen=document.getElementById('game-screen');if(screen)screen.addEventListener('click',e=>{const box=screen.getBoundingClientRect();document.getElementById('tap-x').value=(e.clientX-box.left)/box.width;document.getElementById('tap-y').value=(e.clientY-box.top)/box.height;document.getElementById('tap-form').submit()});</script></body></html>
